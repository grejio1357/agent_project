services:
  # 1. PostgreSQL 서비스
  postgres:
    image: postgres:15
    container_name: agri_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agri
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/data:/data   # CSV 접근용
    restart: unless-stopped

  # 2. OpenSearch 서비스 (새로 추가됨)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: agri_opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # 메모리 제한 (필요시 조절)
      - DISABLE_INSTALL_DEMO_CONFIG=true # 보안 설정 간소화
      - DISABLE_SECURITY_PLUGIN=true    # 로컬 테스트용 HTTP 허용
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200" # REST API 접속 포트
    volumes:
      - os_data:/usr/share/opensearch/data
    restart: unless-stopped

volumes:
  postgres_data:
  os_data: